<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para o Amor da Minha Vida 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6005f3,#ffc371);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
text-align:center;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
background:rgba(255,255,255,.18);
margin:20px;
padding:20px;
border-radius:22px;
backdrop-filter:blur(12px);
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

button{
background:linear-gradient(135deg,#ff2f92,#6005f3);
border:none;
padding:15px 28px;
color:white;
border-radius:30px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="intro" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6005f3,#ff2f92);z-index:9999;">
<div style="background:rgba(255,255,255,.18);padding:30px;border-radius:25px;">
<h1>💖 Para o Amor da Minha Vida 💖</h1>
<p>Clique quando estiver pronta 🤍</p>
<button onclick="startSite()">Começar 💕</button>
</div>
</div>

<div id="site" style="display:none">
<h1>💖 Para Você, Meu Amor 💖</h1>

<div class="card">
<h2>💌 Uma carta só pra você</h2>
<p id="typewriter"></p>
</div>

<audio id="typingSound" src="keyboard.mp3"></audio>

</div>

<script>

/* INTRO */
function startSite(){
intro.style.opacity=0;
setTimeout(()=>{
intro.style.display="none";
site.style.display="block";
},1000);
}

/* TYPEWRITER LENTO E SINCRONIZADO */
const text=`Meu amor...

Meu amor, hoje é um dos momentos mais especiais para mim.

Sou grato a Deus pelo privilégio de poder te chamar de MINHA NOIVA.

Meu amor, eu te amo! Você é a mulher da minha vida.`;

let i=0;
const el=document.getElementById("typewriter");
const typingSound=document.getElementById("typingSound");

typingSound.volume=0.15;

function typeWriter(){

if(i < text.length){

let char=text.charAt(i);
el.innerHTML+=char;

// só toca se o som terminou
if(char !== "\n" && char !== " " && typingSound.paused){
typingSound.currentTime=0;
typingSound.play();
}

// digitação bem mais lenta
let delay=280;

// pausas emocionais
if(char==="\n") delay=1200;
if(text.substr(i,11)==="MINHA NOIVA") delay=2000;
if(text.substr(i,9).toLowerCase()==="eu te amo") delay=2500;

i++;
setTimeout(typeWriter,delay);
}
}

typeWriter();

</script>

</body>
</html>
