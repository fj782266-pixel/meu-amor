<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para o Amor da Minha Vida 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6005f3,#ffc371);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
text-align:center;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
background:rgba(255,255,255,.18);
margin:20px;
padding:20px;
border-radius:22px;
backdrop-filter:blur(12px);
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.slideshow img{
width:100%;
max-height:400px;
border-radius:15px;
transition:opacity 1s;
}

button{
background:linear-gradient(135deg,#ff2f92,#6005f3);
border:none;
padding:15px 28px;
color:white;
border-radius:30px;
cursor:pointer;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div id="intro">
<div style="background:rgba(255,255,255,.18);padding:30px;border-radius:25px;">
<h1>💖 Para o Amor da Minha Vida 💖</h1>
<p>Clique quando estiver pronta 🤍</p>
<button onclick="startSite()">Começar 💕</button>
</div>
</div>

<div id="site" style="display:none">

<h1>💖 Para Você, Meu Amor 💖</h1>

<div class="card">
<h2>💌 Uma carta só pra você</h2>
<p id="typewriter"></p>
</div>

<div class="card">
<button onclick="playMusic()">Tocar Música ❤️</button>
<audio id="music" src="nova-musica.mp3" loop></audio>
</div>

</div>

<script>

/* INTRO */
function startSite(){
intro.style.opacity=0;
setTimeout(()=>{
intro.style.display="none";
site.style.display="block";
site.style.animation="fadeIn 1.5s";
},1200);
}

/* MÚSICA */
const music = document.getElementById("music");
music.volume = 0.2;

function playMusic(){
music.play();
}

/* TYPEWRITER LENTO E ROMÂNTICO */
const text=`Meu amor...

Meu amor, hoje é um dos momentos mais especiais para mim.

Sou grato a Deus pelo privilégio de poder te chamar de MINHA NOIVA.

Meu amor, eu te amo! Você é a mulher da minha vida.`;

let i=0;
const el=document.getElementById("typewriter");

function playTypingSound(){
  const sound = new Audio("keyboard.mp3");
  sound.volume = 0.07; // bem suave
  sound.play();
}

function typeWriter(){

if(i < text.length){

let char = text.charAt(i);
el.innerHTML += char;

// toca som apenas para letras
if(char !== "\n" && char !== " "){
playTypingSound();
}

// velocidade humana lenta
let delay = Math.random() * 150 + 180; 
// entre 180ms e 330ms

// pausas dramáticas
if(char === "\n") delay = 1000;
if(text.substr(i,11) === "MINHA NOIVA") delay = 1800;
if(text.substr(i,9).toLowerCase() === "eu te amo") delay = 2200;

i++;
setTimeout(typeWriter, delay);
}
}

typeWriter();

</script>

</body>
</html>
