<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para o Amor da Minha Vida 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6005f3,#ffc371);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
text-align:center;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
background:rgba(255,255,255,.18);
margin:20px;
padding:20px;
border-radius:22px;
backdrop-filter:blur(12px);
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.slideshow img{
width:100%;
max-height:400px;
border-radius:15px;
transition:opacity 1s;
}

button{
background:linear-gradient(135deg,#ff2f92,#6005f3);
border:none;
padding:15px 28px;
color:white;
border-radius:30px;
cursor:pointer;
}

.heart{
position:fixed;
bottom:-20px;
animation:float 6s linear forwards;
cursor:pointer;
}

@keyframes float{
to{transform:translateY(-110vh);opacity:0}
}

.mensagem{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.85);
padding:20px 30px;
border-radius:25px;
animation:fade 3s forwards;
}

@keyframes fade{
0%{opacity:0}
20%{opacity:1}
80%{opacity:1}
100%{opacity:0}
}

#intro{
position:fixed;
inset:0;
background:linear-gradient(135deg,#6005f3,#ff2f92);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.intro-content{
background:rgba(255,255,255,.18);
padding:30px;
border-radius:25px;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div id="intro">
<div class="intro-content">
<h1>💖 Para o Amor da Minha Vida 💖</h1>
<p>Clique quando estiver pronta 🤍</p>
<button onclick="startSite()">Começar 💕</button>
</div>
</div>

<div id="site" style="display:none">

<h1>💖 Para Você, Meu Amor 💖</h1>

<div class="card">
<p>Feliz aniversário, minha noiva linda 💕</p>
</div>

<div class="card">
<h2>💌 Uma carta só pra você</h2>
<p id="typewriter"></p>
</div>

<div class="card">
<h2>📸 EU TE AMO</h2>
<div class="slideshow">
<img id="slide" src="./meuamor/foto1.jpg">
</div>
</div>

<div class="card">
<h2>🎥 Um dos melhores momentos contigo</h2>
<video controls style="width:100%;border-radius:20px">
<source src="./video.mp4" type="video/mp4">
</video>
<h3>💖 Nosso tempo juntos 💖</h3>
<p id="tempo"></p>
</div>

<div class="card">
<button onclick="playMusic()">Tocar Música ❤️</button>
<audio id="music" src="nova-musica.mp3" loop></audio>
</div>

</div>

<script>
/* 🎵 MÚSICA COM FADE */
const music = document.getElementById("music");
music.volume = 0;

let fadeInterval = null;
let musicStarted = false;

function fadeInMusic(){
  clearInterval(fadeInterval);
  fadeInterval = setInterval(() => {
    if (music.volume < 0.2) {
      music.volume = Math.min(music.volume + 0.01, 0.2);
    } else {
      clearInterval(fadeInterval);
    }
  }, 150);
}

function playMusic(){
  if(!musicStarted){
    music.play();
    fadeInMusic();
    musicStarted = true;
  }
}

/* tocar ao clicar em qualquer lugar */
document.addEventListener("click", playMusic);

/* INTRO */
function startSite(){
const intro = document.getElementById("intro");
const site = document.getElementById("site");

intro.style.opacity=0;
setTimeout(()=>{
intro.style.display="none";
site.style.display="block";
site.style.animation="fadeIn 1.5s";
},1200);
}

/* TYPEWRITER */
const text=`Meu amor...

hoje é o dia mais especial da minha vida, pois foi o dia em que minha linda princesa veio ao mundo. Sou grato a Deus pelo privilégio de ter você ao meu lado.

Te desejo toda a felicidade e tudo o que há de melhor para você, minha vida. Te parabenizo por mais um ano de vida e quero estar sempre ao seu lado, te ajudando e te fazendo uma mulher muito feliz.

Aguardo ansioso pelo nosso casamento, pois sei o quanto nossos dias serão ainda mais especiais. Meu amor, eu te amo demais! Obrigado por cada momento. Você significa muito para mim.

Eu te amo demais, minha nega. Estarei sempre ao seu lado. Eu te amo muito! ❤️
`;

let i=0;
const el=document.getElementById("typewriter");

function typeWriter(){
if(i<text.length){
el.innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,70);
}}
typeWriter();

/* CONTADOR COMPLETO */
function atualizar(){
  const inicio = new Date(2023, 5, 21, 0, 0, 0);
  const agora = new Date();

  let anos = agora.getFullYear() - inicio.getFullYear();
  let meses = agora.getMonth() - inicio.getMonth();
  let dias = agora.getDate() - inicio.getDate();
  let horas = agora.getHours() - inicio.getHours();
  let minutos = agora.getMinutes() - inicio.getMinutes();
  let segundos = agora.getSeconds() - inicio.getSeconds();

  if (segundos < 0) { segundos += 60; minutos--; }
  if (minutos < 0) { minutos += 60; horas--; }
  if (horas < 0) { horas += 24; dias--; }
  if (dias < 0) {
    meses--;
    const ultimoMes = new Date(agora.getFullYear(), agora.getMonth(), 0);
    dias += ultimoMes.getDate();
  }
  if (meses < 0) { meses += 12; anos--; }

  document.getElementById("tempo").innerHTML =
    `${anos} anos, ${meses} meses, ${dias} dias<br>
     ${horas} horas, ${minutos} minutos e ${segundos} segundos 💕`;
}
setInterval(atualizar,1000);
atualizar();

/* SLIDES */
const fotos=["./meuamor/foto1.jpg","./meuamor/foto2.jpg","./meuamor/foto3.jpg","./meuamor/foto4.jpg","./meuamor/foto5.jpg","./meuamor/foto6.jpg","./meuamor/foto7.jpg", "./meuamor/foto8.jpg", "./meuamor/foto9.jpg","./meuamor/video1.mp4"];
let idx=0;
setInterval(()=>{
idx=(idx+1)%fotos.length;
slide.style.opacity=0;
setTimeout(()=>{slide.src=fotos[idx];slide.style.opacity=1},500);
},3000);

/* CORAÇÕES */
const msgs=["Te amo 💖","Meu lar ❤️","Pra sempre nós ✨"];
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.onclick=()=>{
const m=document.createElement("div");
m.className="mensagem";
m.innerText=msgs[Math.floor(Math.random()*msgs.length)];
document.body.appendChild(m);
setTimeout(()=>m.remove(),3000);
};
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);
</script>

</body>
</html>
